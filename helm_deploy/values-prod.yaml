---
# Environment specific values, override helm_deploy/probation-offender-search/values.yaml

generic-service:
  ingress:
    host: probation-offender-search.hmpps.service.justice.gov.uk
    contextColour: green

  env:
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "https://sign-in.hmpps.service.justice.gov.uk/auth/.well-known/jwks.json"
    OAUTH_ENDPOINT_URL: "https://sign-in.hmpps.service.justice.gov.uk"
    COMMUNITY_ENDPOINT_URL: "https://community-api-secure.probation.service.justice.gov.uk"
    DELIUS_ENDPOINT_URL: "https://probation-search-and-delius.hmpps.service.justice.gov.uk"
    SENTRY_ENVIRONMENT: prod
    FLIPT_URL: https://feature-toggles.hmpps.service.justice.gov.uk
    DATALOAD_ONDEMAND_BATCH_SIZE: 100

  allowlist:
    delius-prod-1: 52.56.115.146/32
    delius-prod-2: 35.178.104.253/32
    delius-prod-3: 35.177.47.45/32

## Additional service for talking to the old OpenSearch cluster, so that MPOP can continue to use the contact keyword search index
# TODO remove this service once MPOP has been migrated to the new OpenSearch cluster and the old cluster has been decommissioned
generic-service-old:
  nameOverride: probation-offender-search-old
  serviceAccountName: probation-search

  resources:
    requests:
      cpu: 128m
      memory: 1024Mi
    limits:
      cpu: "1"
      memory: 1280Mi

  image:
    repository: ghcr.io/ministryofjustice/probation-offender-search
    tag: app_version # override at deployment time
    port: 8080

  ingress:
    host: probation-offender-search-old.hmpps.service.justice.gov.uk
    tlsSecretName: probation-offender-search-old-cert
    contextColour: green
    enabled: true
    v1_2_enabled: true
    v0_47_enabled: false

  env:
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "https://sign-in.hmpps.service.justice.gov.uk/auth/.well-known/jwks.json"
    OAUTH_ENDPOINT_URL: "https://sign-in.hmpps.service.justice.gov.uk"
    COMMUNITY_ENDPOINT_URL: "https://community-api-secure.probation.service.justice.gov.uk"
    DELIUS_ENDPOINT_URL: "https://probation-search-and-delius.hmpps.service.justice.gov.uk"
    SENTRY_ENVIRONMENT: prod
    FLIPT_URL: https://feature-toggles.hmpps.service.justice.gov.uk
    DATALOAD_ONDEMAND_BATCH_SIZE: 100
    SPRING_PROFILES_ACTIVE: "opensearch"
    APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=$(APPINSIGHTS_INSTRUMENTATIONKEY)"
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: applicationinsights.json
    JDK_JAVA_OPTIONS: "-javaagent:/agent/agent.jar -Xmx512m"
    AWS_REGION: "eu-west-2"
    SEARCH_SUPPORTED_MAPPING_VERSION: "2"
    OPENSEARCH_SOCKET-TIMEOUT: "10m"

  namespace_secrets:
    probation-offender-search:
      APPINSIGHTS_INSTRUMENTATIONKEY: "APPINSIGHTS_INSTRUMENTATIONKEY"
      SENTRY_DSN: "SENTRY_DSN"
      FLIPT_TOKEN: FLIPT_TOKEN
    probation-search-client-credentials:
      OAUTH_CLIENT_ID: CLIENT_ID
      OAUTH_CLIENT_SECRET: CLIENT_SECRET
    sqs-hmpps-audit-secret:
      HMPPS_SQS_QUEUES_AUDIT_QUEUE_NAME: sqs_queue_name
    opensearch:
      OPENSEARCH_URIS: "old_url"

  allowlist:
    analyticplatform-1: 34.250.17.221/32
    analyticplatform-2: 34.251.212.33/32
    analyticplatform-3: 34.252.4.39/32
    delius-prod-1: 52.56.115.146/32
    delius-prod-2: 35.178.104.253/32
    delius-prod-3: 35.177.47.45/32
    groups:
      - internal
      - unilink_staff

cron:
  SYNTHETIC_MONITOR_CRON_EXPRESSION: "*/10 * * * *"

# CloudPlatform AlertManager receiver to route prometheus alerts to slack
generic-prometheus-alerts:
  alertSeverity: probation-integration-notifications

  openSearchAlertsDomainNames:
    cloud-platform-1cc47140: OpenSearch
  openSearchAlertsFreeStorageSpaceThresholdGB: 60
  openSearchAlertsClusterStatusYellowMinutes: 180 # cluster status can be yellow during replication following data re-indexing - this is expected