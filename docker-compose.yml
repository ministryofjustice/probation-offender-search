services:
  opensearch:
    image: opensearchproject/opensearch:3.7.0
    networks:
      - hmpps
    ports:
      - 9200:9200
      - 9600:9600
    environment:
      - node.name=opensearch
      - cluster.name=probation-search-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms8g -Xmx8g # Note: ensure enough memory is allocated in Docker Desktop settings
      - plugins.ml_commons.only_run_on_ml_node=false
      - plugins.ml_commons.model_access_control_enabled=false
      - plugins.ml_commons.native_memory_threshold=99
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.7.0
    networks:
      - hmpps
    ports:
      - 5601:5601
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch

networks:
  hmpps:
